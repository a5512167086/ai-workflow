# SonarCloud 自動分析的範圍（Automatic Analysis 讀這個檔，不需要 CI）。
sonar.sources=src,src-tauri/src
sonar.tests=src,src-tauri/tests
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src-tauri/tests/**
# shadcn/ui 產生的元件、瀏覽器預覽用的假後端與測試設定不算產品程式碼。
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/components/ui/**,src/dev/**,src/test/**
sonar.sourceEncoding=UTF-8
