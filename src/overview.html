<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>所有專案 — aipipe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#main">跳到主要內容</a>

  <svg width="0" height="0" class="sprite" aria-hidden="true">
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><path d="M3 5h18v11H3zM8 20h8M12 16v4"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3l10 18H2zM12 10v4M12 17.5v.01"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6h7l2 2h9v11H3z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="i-forward" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-queue" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></symbol>
  </svg>

  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg><use href="#i-pulse"/></svg></span>
      <span class="name">aipipe</span>
      <span class="project">所有專案</span>
    </div>
    <div class="status-line">
      <span id="attention" class="pill" role="status" aria-atomic="true"><span class="dot" aria-hidden="true"></span><span class="pill-text">—</span></span>
      <span id="queue-line" class="reason"></span>
    </div>
    <div class="top-actions">
      <button id="show-projects" type="button">專案</button><button id="show-settings" type="button">設定</button>
      <button id="btn-theme" class="icon-btn" type="button" aria-label="主題：跟隨系統" title="主題：跟隨系統">
        <svg class="ic"><use href="#i-monitor"/></svg>
      </button>
    </div>
  </header>

  <main id="main" tabindex="-1" class="overview">
    <div class="overview-tools">
      <div class="card add-card">
        <div class="card-head"><h2>加入專案</h2><span class="hint">專案清單存在 ~/.aipipe/projects.json</span></div>
        <label for="add-path" class="field-label">專案資料夾</label>
        <div class="path-row">
          <input id="add-path" type="text" class="mono" placeholder="例如：C:\code\my-app" spellcheck="false">
          <button id="btn-pick" class="hidden" type="button"><svg class="ic"><use href="#i-folder"/></svg>選擇資料夾</button>
          <button id="btn-add" class="primary" type="button"><svg class="ic"><use href="#i-plus"/></svg>加入</button>
        </div>
      </div>

    </div>

    <section id="overview-settings" hidden><div class="settings-toolbar"><h2>設定</h2><label for="settings-project">專案</label><select id="settings-project"></select></div><p id="settings-empty" class="hint" hidden>先加入專案，即可設定各階段的 AI 與模型。</p><iframe id="project-settings" title="所選專案設定"></iframe>
      <div class="card home-queue"><label for="max-runs">全域同時執行上限</label><select id="max-runs"><option value="1">1 個</option><option value="2">2 個</option><option value="3">3 個</option><option value="4">4 個</option></select><span class="hint">其他專案會排隊，等待人工測試不占名額。</span></div>
    </section>
    <section id="projects-panel" aria-labelledby="projects-h">
      <h2 id="projects-h" class="section-h">專案 <span class="tab-badge" id="count"></span></h2>
      <div id="projects" class="project-grid"></div>
    </section>
  </main>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script src="common.js"></script>
  <script src="overview.js"></script>
</body>
</html>
