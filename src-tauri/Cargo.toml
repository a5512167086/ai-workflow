[package]
name = "ai-workflow-desktop"
version = "0.1.0"
description = "ai-workflow 桌面版"
license = "MIT"
repository = "https://github.com/a5512167086/ai-workflow"
edition = "2021"

[lib]
name = "ai_workflow"
path = "src/lib.rs"

[[bin]]
name = "ai-workflow-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# preserve_order：寫回 JSON 時保留欄位順序，與 Node 版產生的檔案一致。
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1"
yaml-rust2 = "0.10"
regex = "1"
base64 = "0.22"
pdf-extract = "0.12.1"
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Console"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
