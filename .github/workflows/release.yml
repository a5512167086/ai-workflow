# 推送版本 tag（例如 v0.1.0）時建置 Windows 安裝包（NSIS），建立 GitHub Release 並附上安裝檔。
# tag 必須和 package.json、src-tauri/tauri.conf.json、src-tauri/Cargo.toml 的版本一致，不一致就停下來。
# tag 含 "-"（例如 v0.2.0-beta.1）會標成 pre-release。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build installer and publish release
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG.TrimStart('v')
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          "tag=$tag package.json=$pkg tauri.conf.json=$tauri Cargo.toml=$cargo"
          if ($tag -ne $pkg -or $tag -ne $tauri -or $tag -ne $cargo) {
            Write-Error "tag v$tag 和 App 版本不一致：先把三個檔案的版本改成 $tag 再打 tag。"
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      # 安裝包會附上 src-tauri/licenses/THIRD_PARTY_LICENSES.txt，發布前確認它和依賴一致。
      - name: Third-party licenses up to date
        run: npm run licenses:check

      # beforeBuildCommand 會先做 tsc -b 與 vite build；bundle 目標在 tauri.conf.json（nsis）。
      - name: Build installer
        run: npm run build

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ai-workflow ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
